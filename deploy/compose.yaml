name: graphwar

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BIND_ADDR: 0.0.0.0:18081
      DATABASE_URL: postgres://graphwar@postgres:5432/graphwar
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DATABASE_MAX_CONNECTIONS: 10
      ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN}
      SECURE_COOKIES: true
      SESSION_TTL_SECONDS: 2592000
      GRAPHWAR_STATIC_DIR: /app/assets/web
      RUST_LOG: graphwar_server=info,tower_http=info
    network_mode: service:cloudflared
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: graphwar
      POSTGRES_USER: graphwar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphwar -d graphwar"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare-tunnel-token
    secrets:
      - cloudflare-tunnel-token
    networks:
      - database
      - tunnel
    restart: unless-stopped

networks:
  database:
    internal: true
  tunnel:

volumes:
  postgres-data:

secrets:
  cloudflare-tunnel-token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./cloudflare-tunnel-token}
