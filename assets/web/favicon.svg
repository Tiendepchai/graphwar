<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1d18"/>
      <stop offset="100%" stop-color="#060e0c"/>
    </linearGradient>
    <linearGradient id="trajGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#59b390"/>
      <stop offset="100%" stop-color="#ff6b57"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff6b57" flood-opacity="0.6"/>
    </filter>
    <filter id="blipGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#e0f274" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Cyber Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#275747" stroke-width="2"/>

  <!-- Coordinate Grid Lines -->
  <line x1="8" y1="20" x2="56" y2="20" stroke="#59b390" stroke-width="1" stroke-dasharray="2 3" opacity="0.2"/>
  <line x1="8" y1="34" x2="56" y2="34" stroke="#59b390" stroke-width="1" stroke-dasharray="2 3" opacity="0.2"/>
  <line x1="8" y1="48" x2="56" y2="48" stroke="#59b390" stroke-width="1.5" opacity="0.45"/> <!-- X Axis -->

  <line x1="18" y1="8" x2="18" y2="56" stroke="#59b390" stroke-width="1.5" opacity="0.45"/> <!-- Y Axis -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#59b390" stroke-width="1" stroke-dasharray="2 3" opacity="0.2"/>
  <line x1="46" y1="8" x2="46" y2="56" stroke="#59b390" stroke-width="1" stroke-dasharray="2 3" opacity="0.2"/>

  <!-- Origin Marker -->
  <circle cx="18" cy="48" r="2" fill="#59b390"/>

  <!-- Mathematical Parabolic Trajectory Curve: y = f(x) -->
  <path d="M 18 48 Q 33 12 50 36" fill="none" stroke="url(#trajGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Target Beacon / Impact Blip -->
  <circle cx="50" cy="36" r="4.5" fill="#e0f274" stroke="#0c1d18" stroke-width="1" filter="url(#blipGlow)"/>
  <circle cx="50" cy="36" r="7" fill="none" stroke="#ff6b57" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"/>
</svg>
